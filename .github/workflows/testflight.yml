# Compile, signe et envoie KeyForge (app + extension de remplissage automatique) sur
# TestFlight. Lancement manuel : Actions → TestFlight → Run workflow.
#
# Secrets du dépôt (Settings → Secrets and variables → Actions) :
#   ASC_KEY_ID        Key ID de la clé API App Store Connect
#   ASC_ISSUER_ID     Issuer ID (en haut de la page des clés)
#   ASC_KEY_P8        contenu du fichier AuthKey_XXXX.p8 (texte complet, BEGIN/END compris)
#   APPLE_TEAM_ID     Team ID, facultatif : retrouvé sinon avec la clé API
#
# La signature est automatique : avec la clé API, Xcode crée lui-même certificats et
# profils (clé avec le rôle Admin) et active les capacités des entitlements.

name: TestFlight

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version affichée (vide : celle du projet)"
        required: false
        default: ""

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    name: Archive and upload to TestFlight
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v5

      - name: Select the newest Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | sed -E 's/.*Xcode_([0-9.]+)\.app/\1 &/' \
            | grep -vi beta | sort -t. -k1,1n -k2,2n -k3,3n | tail -1 | cut -d' ' -f2)
          echo "Using $xcode"
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version

      - name: Check the secrets
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=0
          # APPLE_TEAM_ID est facultatif : sans lui, il est retrouvé avec la clé API.
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            if [ -z "${!name}" ]; then echo "::error::Secret manquant : $name"; missing=1; fi
          done
          exit $missing

      - name: Install the API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"

      - name: Team ID
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          team="$APPLE_TEAM_ID"
          if [ -z "$team" ]; then
            team=$(python3 Design/asc_team_id.py "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" \
              "$ASC_KEY_ID" "$ASC_ISSUER_ID" com.maxlestage.KeyForge)
            echo "Team ID retrouvé avec la clé API : $team"
          fi
          echo "TEAM_ID=$team" >> "$GITHUB_ENV"

      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          VERSION: ${{ inputs.version }}
        run: |
          set -o pipefail
          # Un numéro de build unique à chaque envoi (exigé par App Store Connect),
          # le même pour l'app et l'extension.
          build=$(( 100 + ${{ github.run_number }} ))
          extra=()
          [ -n "$VERSION" ] && extra+=("MARKETING_VERSION=$VERSION")
          echo "Build $build ${VERSION:+(version $VERSION)}"
          xcodebuild -project KeyForge.xcodeproj -scheme KeyForge -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/KeyForge.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CURRENT_PROJECT_VERSION="$build" \
            "${extra[@]}" \
            archive > "$RUNNER_TEMP/archive.log" 2>&1 \
            || { grep -E "error:|ARCHIVE FAILED" "$RUNNER_TEMP/archive.log"; tail -n 80 "$RUNNER_TEMP/archive.log"; exit 1; }
          grep -E "ARCHIVE SUCCEEDED" "$RUNNER_TEMP/archive.log"

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          /usr/libexec/PlistBuddy -c "Add :teamID string $TEAM_ID" ExportOptions.plist
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/KeyForge.xcarchive" \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            > "$RUNNER_TEMP/export.log" 2>&1 \
            || { tail -n 80 "$RUNNER_TEMP/export.log"; exit 1; }
          grep -E "EXPORT SUCCEEDED|Upload succeeded|Uploaded" "$RUNNER_TEMP/export.log" || tail -n 20 "$RUNNER_TEMP/export.log"
          echo "Build envoyé : il apparaît dans App Store Connect → TestFlight après le traitement par Apple (quelques minutes)."

      - name: Remove the API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
