# Builds the KeyForge iOS app and runs its unit tests on an iOS simulator.
# No signing: CODE_SIGNING_ALLOWED=NO builds for the simulator only.

name: iOS

on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (simulator)
    runs-on: macos-15
    timeout-minutes: 40
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v5

      - name: Select the newest Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | sed -E 's/.*Xcode_([0-9.]+)\.app/\1 &/' \
            | grep -vi beta | sort -t. -k1,1n -k2,2n -k3,3n | tail -1 | cut -d' ' -f2)
          echo "Using $xcode"
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version

      - name: Build
        run: |
          set +e
          xcodebuild -project KeyForge.xcodeproj -scheme KeyForge \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO build > "$RUNNER_TEMP/build.log" 2>&1
          status=$?
          grep -E "error:|warning: .*\.swift|BUILD (SUCCEEDED|FAILED)" "$RUNNER_TEMP/build.log"
          [ "$status" -eq 0 ] || tail -n 80 "$RUNNER_TEMP/build.log"
          exit $status

      - name: Pick an iPhone simulator
        id: sim
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          phones = []
          for runtime, devices in data.items():
              if "iOS" not in runtime:
                  continue
              version = tuple(int(x) for x in runtime.rsplit("iOS-", 1)[-1].split("-") if x.isdigit())
              for d in devices:
                  if d.get("isAvailable") and d["name"].startswith("iPhone"):
                      phones.append((version, d["name"], d["udid"]))
          phones.sort()
          if not phones:
              sys.exit("no iPhone simulator available")
          print(phones[-1][2])
          name, version = phones[-1][1], ".".join(map(str, phones[-1][0]))
          print(f"{name} (iOS {version})", file=sys.stderr)
          ')
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Test
        run: |
          set +e
          xcodebuild -project KeyForge.xcodeproj -scheme KeyForge \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/KeyForge.xcresult" \
            CODE_SIGNING_ALLOWED=NO test > "$RUNNER_TEMP/test.log" 2>&1
          status=$?
          grep -E "error:|Test Case .*(passed|failed)|Executed|TEST (SUCCEEDED|FAILED)" "$RUNNER_TEMP/test.log"
          [ "$status" -eq 0 ] || tail -n 80 "$RUNNER_TEMP/test.log"
          exit $status

      - name: Run on the simulator (app and AutoFill extension)
        timeout-minutes: 15
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set -euo pipefail
          # Chaque commande du simulateur est bornée (macOS n'a pas `timeout`) et annoncée.
          limit() { local s=$1; shift; echo "→ $*"; perl -e 'alarm shift; exec @ARGV' "$s" "$@"; }
          app="$RUNNER_TEMP/DerivedData/Build/Products/Debug-iphonesimulator/KeyForge.app"
          appex="$app/PlugIns/KeyForgeAutoFill.appex"
          echo "::group::L'extension est embarquée dans l'app"
          test -d "$appex" || { echo "KeyForgeAutoFill.appex absent de $app/PlugIns"; ls -la "$app"; exit 1; }
          point=$(/usr/libexec/PlistBuddy -c "Print :NSExtension:NSExtensionPointIdentifier" "$appex/Info.plist")
          echo "Point d'extension : $point"
          test "$point" = "com.apple.authentication-services-credential-provider-ui"
          /usr/libexec/PlistBuddy -c "Print :NSExtension" "$appex/Info.plist"
          echo "::endgroup::"

          echo "::group::Installation et lancement"
          xcrun simctl list devices | grep "$UDID" || true
          limit 120 xcrun simctl boot "$UDID" 2>/dev/null || true
          limit 180 xcrun simctl bootstatus "$UDID" -b || echo "bootstatus : délai dépassé, on continue"
          limit 240 xcrun simctl install "$UDID" "$app"
          limit 180 xcrun simctl launch "$UDID" com.maxlestage.KeyForge
          sleep 10
          # Toujours en vie dix secondes plus tard : pas de plantage au lancement
          # (migration du coffre, sonde du trousseau, réglages).
          limit 30 xcrun simctl spawn "$UDID" launchctl list | grep -i "com.maxlestage.KeyForge" \
            || { echo "KeyForge ne tourne plus après le lancement"; exit 1; }
          mkdir -p "$RUNNER_TEMP/screens"
          limit 30 xcrun simctl io "$UDID" screenshot "$RUNNER_TEMP/screens/keyforge-launch.png"
          echo "::endgroup::"

          echo "::group::iOS enregistre le fournisseur d'identifiants"
          limit 30 xcrun simctl spawn "$UDID" pluginkit -m -A -v -p com.apple.authentication-services-credential-provider-ui \
            | tee "$RUNNER_TEMP/plugins.txt" || true
          if grep -q "com.maxlestage.KeyForge.AutoFill" "$RUNNER_TEMP/plugins.txt"; then
            echo "KeyForgeAutoFill est enregistrée par le simulateur."
          else
            echo "::warning::pluginkit ne liste pas KeyForgeAutoFill (outil absent ou extension refusée)."
          fi
          echo "::endgroup::"

      - name: Upload the simulator screenshot
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: KeyForge-simulator
          path: ${{ runner.temp }}/screens
          if-no-files-found: ignore

      - name: Upload the test results
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: KeyForge-xcresult
          path: ${{ runner.temp }}/KeyForge.xcresult
          if-no-files-found: ignore
