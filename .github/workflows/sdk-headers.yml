# Diagnostic : les versions de Xcode installées sur les runners macOS. Lancement manuel.
name: SDK headers

on:
  workflow_dispatch:

jobs:
  xcodes:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - name: Installed Xcode versions
        run: |
          sw_vers
          ls -d /Applications/Xcode*.app
