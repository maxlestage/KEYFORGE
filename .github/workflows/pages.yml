# Publie le site sur GitHub Pages après chaque CI verte de master (et à la main :
# Actions → GitHub Pages → Run workflow).
#
# Le site est une application Paquets : `keyforge-site export` le rend entièrement en
# fichiers statiques (chaque page, le bundle WebAssembly, la PWA, le plan du site), avec
# chaque adresse derrière le chemin du dépôt (/KEYFORGE).
#
# Réglage unique : GitHub → Settings → Pages → Build and deployment → Source :
# « GitHub Actions ».

name: GitHub Pages

on:
  workflow_run:
    workflows: [Site]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  REPOS_TOKEN: ${{ secrets.REPOS_TOKEN }}
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  GIT_CONFIG_COUNT: ${{ secrets.REPOS_TOKEN != '' && 1 || 0 }}
  GIT_CONFIG_KEY_0: credential.https://github.com.helper
  GIT_CONFIG_VALUE_0: '!f() { test "$1" = get && echo username=x-access-token && echo "password=$REPOS_TOKEN"; }; f'

jobs:
  build:
    name: Export statique
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Adresse de GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: site
      - name: Îlots WebAssembly et serveur
        run: ./site/build.sh
      - name: Export
        working-directory: site
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          ./target/release/keyforge-site export ../dist
          test -f ../dist/index.html && test -f ../dist/404.html && test -f ../dist/sw.js
          grep -q "\"$BASE_PATH/pkg/keyforge_site.js" ../dist/fr/index.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Publication
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publier sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Résumé
        run: echo "### 🚀 Publié sur [${{ steps.deployment.outputs.page_url }}](${{ steps.deployment.outputs.page_url }})" >> "$GITHUB_STEP_SUMMARY"
